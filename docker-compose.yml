version: '3.8'

services:
  # PostgreSQL: Your Relational Staging Database
  postgres:
    image: postgres:15-alpine
    container_name: pulseai_postgres
    restart: always
    environment:
      POSTGRES_USER: pulse_admin
      POSTGRES_PASSWORD: pulse_password_123
      POSTGRES_DB: pulseai_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse_admin -d pulseai_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Qdrant: Your Vector Database for Embeddings
  qdrant:
    image: qdrant/qdrant:latest
    container_name: pulseai_qdrant
    restart: always
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

# Named volumes persist data even if the containers are stopped or removed
volumes:
  postgres_data:
  qdrant_data: