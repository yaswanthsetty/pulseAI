name: pulseai

# Shared environment for app services (all talk to infra via service names).
x-app-env: &app-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-pulse_admin}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulse_password_123}
  POSTGRES_DB: ${POSTGRES_DB:-pulseai_db}
  QDRANT_URL: http://qdrant:6333
  REDIS_URL: redis://redis:6379/0
  STORAGE_BACKEND: local
  STORAGE_LOCAL_DIR: /app/storage/objects
  SEED_DEFAULT_SOURCES: "true"
  ENVIRONMENT: development
  # --- Auth (Phase 1.5) ---
  AUTH_PROVIDER: ${AUTH_PROVIDER:-none}
  JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
  JWT_ISSUER: ${JWT_ISSUER:-pulseai}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-pulseai-api}
  CLERK_DOMAIN: ${CLERK_DOMAIN:-}
  AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
  AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  CSRF_ENABLED: ${CSRF_ENABLED:-true}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}

services:
  # --- Infrastructure ----------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: pulseai_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulse_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulse_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-pulseai_db}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulse_admin} -d ${POSTGRES_DB:-pulseai_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: pulseai_qdrant
    restart: always
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: pulseai_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Application processes ----------------------------------------------
  api:
    build: .
    container_name: pulseai_api
    restart: always
    environment: *app-env
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/app/storage/objects
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: .
    container_name: pulseai_worker
    restart: always
    command: ["uv", "run", "--no-sync", "pulseai-worker"]
    environment: *app-env
    volumes:
      - storage_data:/app/storage/objects
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build: .
    container_name: pulseai_scheduler
    restart: always
    command: ["uv", "run", "--no-sync", "pulseai-scheduler"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  qdrant_data:
  storage_data:
