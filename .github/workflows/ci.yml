name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Cancel stale runs: a new push to the same branch supersedes the in-flight one
# (the Phase 2 pipeline is re-gated on every push, so only the latest matters).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: pulse_admin
          POSTGRES_PASSWORD: pulse_password_123
          POSTGRES_DB: pulseai_db
        ports:
          - "5434:5432"
        options: >-
          --health-cmd "pg_isready -U pulse_admin -d pulseai_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Pinned to the version the project develops against (dense + sparse
      # named vectors need 1.13+; 1.18 matches the local dev stack).
      qdrant:
        image: qdrant/qdrant:v1.18.2
        ports:
          - "6333:6333"

    env:
      POSTGRES_USER: pulse_admin
      POSTGRES_PASSWORD: pulse_password_123
      POSTGRES_DB: pulseai_db
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5434"
      QDRANT_URL: http://localhost:6333
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Module boundaries (import-linter)
        run: uv run lint-imports

      - name: Migrations apply cleanly on a fresh database
        run: uv run alembic upgrade head

      - name: Test (pytest + coverage gate)
        run: uv run pytest --cov=backend --cov-report=term-missing --cov-fail-under=80

  security:
    name: Dependency security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      # Audit the locked dependency graph from uv.lock. Auditing the installed
      # environment instead checks zero packages: `pip list --local` (what
      # pip-audit uses via pip-api) returns [] inside uv-managed virtual
      # environments, so the old `-l` invocation always reported "No known
      # vulnerabilities found" without ever querying a package.
      - name: Backend audit (pip-audit)
        run: |
          uv export --frozen --no-hashes --no-emit-project -o requirements-audit.txt
          # accelerate 1.14.0 (PYSEC-2026-3804) has no fixed release, and it
          # cannot be removed: flagembedding and peft import it directly and it
          # is required for BGE-M3 embeddings. Revisit 2027-01-15: drop this
          # ignore once a patched accelerate is published.
          uv run --with pip-audit python -m pip_audit \
            -r requirements-audit.txt \
            --progress-spinner off \
            --desc off \
            --ignore-vuln PYSEC-2026-3804

      # Production dependency tree only. The remaining high findings are in ESLint
      # dev tooling: braces (GHSA-vfj7-8cjw-p6xm, affects <= 3.0.3) has no patched
      # release on npm, and the eslint-config-next -> @next/eslint-plugin-next ->
      # fast-glob -> micromatch -> braces chain has no path around it. Revisit
      # 2027-01-15: drop --omit=dev once braces ships a fix.
      - name: Frontend audit (npm audit)
        working-directory: frontend
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit --omit=dev --audit-level=high
